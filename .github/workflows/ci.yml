name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: native tests with a collection on every allocation
        run: UNDA_TEST_GC_THRESHOLD=1 go test ./tests/ -run 'NativeMatches|NativeLocal|NativeExamples' -count=1
